<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp - Atividades</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar"><h2>Quiz Platform</h2><ul class="nav-links"><li><a href="dashboard.html">Descobrir</a></li><li><a href="estudos.html">Estudos</a></li><li><a href="atividades.html">Atividades</a></li><li><a href="perfil.html">Meu Perfil</a></li><li><button onclick="toggleDarkMode()" class="theme-toggle">Modo Escuro</button></li></ul></nav>
    <main class="activities-page">
        <header class="study-heading"><div><p class="eyebrow">ACOMPANHAMENTO</p><h1>Atividades</h1><p>Veja os quizzes compartilhados com você e acompanhe o que já concluiu.</p></div></header>
        <div class="activities-grid">
            <section class="card activity-section"><div class="study-panel-heading"><div><p class="eyebrow">PARA FAZER</p><h2>Pendentes</h2></div><span id="pendingCount" class="study-count">0</span></div><div id="pendingActivities" class="activity-list"><p class="empty-state">Nenhuma atividade pendente.</p></div></section>
            <section class="card activity-section"><div class="study-panel-heading"><div><p class="eyebrow">HISTÓRICO</p><h2>Concluídas</h2></div><span id="completedCount" class="study-count">0</span></div><div id="completedActivities" class="activity-list"><p class="empty-state">Nenhuma atividade concluída.</p></div></section>
        </div>
    </main>
    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/atividades.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Platform | Acesso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-intro">
            <span class="brand-mark">QP</span>
            <p class="eyebrow">QUIZ PLATFORM</p>
            <h1>Aprender pode ser uma experiência marcante.</h1>
        </section>
        <section class="auth-card" aria-labelledby="authTitle">
            <div class="auth-card-header">
                <div>
                    <p class="eyebrow">BEM-VINDO</p>
                    <h2 id="authTitle">Acesse sua conta</h2>
                </div>
            </div>
            <form id="loginForm" class="auth-form">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                <button class="btn-accent auth-submit" type="submit">Entrar na plataforma</button>
            </form>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

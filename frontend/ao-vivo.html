<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz ao vivo</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script></head>
<body><nav class="navbar"><h2>Quiz Platform</h2><ul class="nav-links"><li><a href="dashboard.html">Descobrir</a></li><li><a href="estudos.html">Estudos</a></li><li><a href="perfil.html" class="profile-nav-avatar" aria-label="Meu perfil" title="Meu perfil"><span>EU</span></a></li><li><button onclick="toggleDarkMode()" class="theme-toggle" aria-label="Alternar tema" title="Alternar tema">☾</button></li></ul></nav>
<main class="live-page"><section class="card"><p class="eyebrow">PARTIDA MULTIPLAYER</p><h1>Quiz ao vivo</h1><p>Crie uma sala para sua turma ou entre usando um código.</p><div class="live-forms"><div><h2>Criar sala</h2><select id="liveQuizSelect"><option value="">Escolha um quiz</option><option value="__novo__">Criar novo quiz</option></select><div class="live-code-picker"><input id="liveQuizCode" placeholder="Código do quiz"><button id="loadLiveQuiz" class="btn-secondary" type="button">Usar código</button></div><p id="liveSetupStatus" class="live-setup-status"></p><a id="createLiveQuiz" class="btn-secondary live-create-link" href="criar.html?retorno=ao-vivo.html">Criar novo quiz</a><button id="createLive" class="btn-accent">Criar sala</button><p id="hostCode"></p><button id="startLive" class="btn-accent" hidden>Iniciar partida</button></div><div><h2>Entrar na sala</h2><input id="liveCode" placeholder="Código da sala"><input id="liveName" placeholder="Seu nome"><button id="joinLive" class="btn-accent">Entrar</button></div></div></section><section id="liveGame" class="card" hidden><p id="liveProgress"></p><h2 id="liveQuestion"></h2><div id="liveOptions" class="opcoes-container"></div><p id="liveStatus"></p></section><section id="liveRanking" class="card" hidden><h2>Resultado da partida</h2><div id="liveRankingList" class="ranking-list"></div></section></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/live.js"></script></body></html>
